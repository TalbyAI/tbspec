name: Application foundation

run-name: >-
  ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) ||
      (inputs.verification_mode == 'full' && startsWith(github.ref, 'refs/heads/release/')))
      && 'Full release verification' ||
      inputs.packed_only == true && 'Artifact-only diagnostic' ||
      inputs.macos_regressions_only == true && 'Focused regression diagnostic' ||
      inputs.macos_intel_source_only == true && 'Intel partition diagnostic' ||
      'Application smoke' }} — ${{ github.ref_name }}

on:
  pull_request:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Run bounded smoke checks or the complete release verification.
        type: choice
        required: true
        default: smoke
        options: [smoke, full]
      packed_only:
        description: Skip the source test job and verify the packed artifact matrix only.
        type: boolean
        required: false
        default: false
      macos_regressions_only:
        description: Run focused ownership, transaction rollback and browser checks on both macOS architectures only.
        type: boolean
        required: false
        default: false
      macos_regression_set:
        description: Select all focused Mac checks or the two slow HTTP regressions; used only with macos_regressions_only.
        type: choice
        required: false
        default: all
        options: [all, slow-http]
      macos_intel_source_only:
        description: Run application source tests in serial partitions on macOS Intel only; select all or one partition below.
        type: boolean
        required: false
        default: false
      macos_intel_partition:
        description: Select all Intel source partitions or rerun one partition; used only with macos_intel_source_only.
        type: choice
        required: false
        default: all
        options: [all, "0", "1", "2"]

permissions:
  contents: read

jobs:
  verification-mode:
    name: Select verification mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Classify event and reject invalid selections
        id: select
        env:
          DISPATCH_MODE: ${{ inputs.verification_mode || 'smoke' }}
          PACKED_ONLY: ${{ inputs.packed_only || false }}
          MACOS_REGRESSIONS_ONLY: ${{ inputs.macos_regressions_only || false }}
          MACOS_INTEL_SOURCE_ONLY: ${{ inputs.macos_intel_source_only || false }}
        run: >-
          node app/scripts/select-verification-mode.mjs
          "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$DISPATCH_MODE"
          "$PACKED_ONLY" "$MACOS_REGRESSIONS_ONLY" "$MACOS_INTEL_SOURCE_ONLY"

  quality-workflow:
    name: Run repository quality
    needs: verification-mode
    if: ${{ needs.verification-mode.outputs.mode == 'smoke' || needs.verification-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  repository-quality:
    name: Repository quality
    needs: [verification-mode, quality-workflow]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.verification-mode.outputs.mode == 'smoke' || needs.verification-mode.outputs.mode == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require the selected mode and quality workflow
        env:
          MODE_RESULT: ${{ needs.verification-mode.result }}
          MODE: ${{ needs.verification-mode.outputs.mode }}
          QUALITY_RESULT: ${{ needs.quality-workflow.result }}
          REQUESTED_MODE: ${{ inputs.verification_mode || 'smoke' }}
          PACKED_ONLY: ${{ inputs.packed_only || false }}
          MACOS_REGRESSIONS_ONLY: ${{ inputs.macos_regressions_only || false }}
          MACOS_INTEL_SOURCE_ONLY: ${{ inputs.macos_intel_source_only || false }}
        run: node scripts/require-verification-gate.mjs repository-quality "$GITHUB_EVENT_NAME" "$GITHUB_REF"

  application:
    name: Node 24 source (${{ matrix.label }})
    needs: verification-mode
    if: ${{ needs.verification-mode.outputs.mode == 'full' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
            source_partition: full
          - os: windows-latest
            label: Windows standard user
            source_partition: full
          - os: macos-latest
            label: macOS ARM
            source_partition: full
          - os: macos-15-intel
            label: macOS Intel source partition 1/3
            source_partition: 0
          - os: macos-15-intel
            label: macOS Intel source partition 2/3
            source_partition: 1
          - os: macos-15-intel
            label: macOS Intel source partition 3/3
            source_partition: 2
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install isolated application dependencies
        run: npm ci
      - name: Typecheck and compile
        run: npm run typecheck && npm run build
      - name: Verify native macOS process identity
        if: runner.os == 'macOS' && matrix.source_partition == 'full'
        run: node --test tests/macos-ownership.test.ts
      - name: Test public operations and processes
        if: runner.os != 'Windows' && matrix.source_partition == 'full'
        run: npm run test:serial
      - name: Test public operations and processes in an Intel source partition
        if: matrix.source_partition != 'full'
        run: node scripts/test-source.mjs ${{ matrix.source_partition }} 3
      - name: Test public operations and processes as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Elevated runner tokens create administrator-owned files; exercise OS-user isolation.
          $password = ConvertTo-SecureString ("Tbspec!" + [guid]::NewGuid().ToString('N')) -AsPlainText -Force
          $user = New-LocalUser -Name 'tbspec-tests' -Password $password
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user
          $credential = [pscredential]::new("$env:COMPUTERNAME\tbspec-tests", $password)
          $stdout = Join-Path $env:RUNNER_TEMP 'tbspec-tests.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'tbspec-tests.stderr'
          $testTemp = Join-Path $env:PUBLIC 'tbspec-tests-temp'
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          & icacls.exe $testTemp /grant 'tbspec-tests:(OI)(CI)F'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the test user temporary directory.' }
          $env:TEMP = $env:TMP = $testTemp
          $node = (Get-Command node).Source
          $tests = Start-Process -FilePath $node -ArgumentList '--test-concurrency=1', '--test', 'tests/*.test.ts' -WorkingDirectory $PWD.Path -Credential $credential -LoadUserProfile -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          Get-Content -LiteralPath $stdout
          Get-Content -LiteralPath $stderr
          exit $tests.ExitCode

  application-build:
    name: Application typecheck and build
    needs: verification-mode
    if: ${{ needs.verification-mode.outputs.mode == 'smoke' || needs.verification-mode.outputs.mode == 'full' || needs.verification-mode.outputs.mode == 'artifact-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install application build dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck application and tests
        working-directory: app
        run: npm run typecheck
      - name: Build and pack one npm artifact
        working-directory: app
        run: |
          mkdir -p ../packed-application
          npm pack --pack-destination ../packed-application
          node scripts/write-artifact-digest.mjs ../packed-application
      - name: Publish workflow artifact for the platform matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tbspec-release-candidate
          path: packed-application/*
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  packed-application:
    name: Installed verification (${{ matrix.label }})
    needs: [verification-mode, application-build]
    if: ${{ needs.verification-mode.outputs.mode == 'smoke' || needs.verification-mode.outputs.mode == 'full' || needs.verification-mode.outputs.mode == 'artifact-only' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
            platform_key: ubuntu
          - os: windows-latest
            label: Windows standard user
            platform_key: windows
          - os: macos-latest
            label: macOS ARM
            platform_key: macos-arm
          - os: macos-15-intel
            label: macOS Intel
            platform_key: macos-intel
    env:
      TBSPEC_VERIFICATION_MODE: ${{ needs.verification-mode.outputs.mode }}
      TBSPEC_PLATFORM: ${{ matrix.platform_key }}
      TBSPEC_COMMIT: ${{ github.sha }}
      TBSPEC_BRANCH: ${{ github.ref_name }}
      TBSPEC_REPOSITORY: ${{ github.repository }}
      TBSPEC_RUN_ID: ${{ github.run_id }}
      TBSPEC_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Download the same packed artifact and SHA-256 file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tbspec-release-candidate
          path: packed-application
      - name: Install the artifact offline and verify smoke workflows
        if: ${{ needs.verification-mode.outputs.mode == 'smoke' && runner.os != 'Windows' }}
        timeout-minutes: 5
        working-directory: app
        run: npm run verify:packed -- ../packed-application ../packed-evidence/${{ matrix.platform_key }}.json
      - name: Install and verify fully on non-Windows platforms
        if: ${{ (needs.verification-mode.outputs.mode == 'full' || needs.verification-mode.outputs.mode == 'artifact-only') && runner.os != 'Windows' }}
        working-directory: app
        run: npm run verify:packed -- ../packed-application ../packed-evidence/${{ matrix.platform_key }}.json
      - name: Install, verify and clean up as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: ${{ needs.verification-mode.outputs.mode == 'smoke' && 10 || 90 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $budgetStartedAt = [DateTime]::UtcNow.ToString('o')
          $budget = [Diagnostics.Stopwatch]::StartNew()
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          $operationFailed = $false
          $userCreated = $false
          $accountRemoved = $false
          $sharedDirectoryCreated = $false
          $sharedDirectoryRemoved = $false
          $evidenceCopied = $false
          $operationExitCode = $null
          $publicPath = $null
          $expectedPublic = $null
          $sharedTemp = $null
          $expectedTemp = $null
          $workspaceEvidence = Join-Path $env:GITHUB_WORKSPACE 'packed-evidence\windows.json'
          try {
            $publicPath = [IO.Path]::GetFullPath($env:PUBLIC)
            $expectedPublic = [IO.Path]::GetFullPath((Join-Path $env:SystemDrive 'Users\Public'))
            if (-not [string]::Equals($publicPath, $expectedPublic, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'The shared test directory is outside the expected Windows Public directory.'
            }
            $sharedTemp = [IO.Path]::GetFullPath((Join-Path $publicPath 'tbspec-packed-tests'))
            $expectedTemp = [IO.Path]::GetFullPath((Join-Path $expectedPublic 'tbspec-packed-tests'))
            if (-not [string]::Equals($sharedTemp, $expectedTemp, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'The shared test cleanup path failed its confinement check.'
            }
            if (Test-Path -LiteralPath $sharedTemp) {
              throw 'The shared Windows test directory already exists.'
            }
            if ($null -ne (Get-LocalUser -Name 'tbspec-packed' -ErrorAction SilentlyContinue)) {
              throw 'The temporary standard-user account already exists.'
            }

            $plainPassword = "Tbspec!" + [guid]::NewGuid().ToString('N')
            Write-Output "::add-mask::$plainPassword"
            $password = ConvertTo-SecureString $plainPassword -AsPlainText -Force
            $user = New-LocalUser -Name 'tbspec-packed' -Password $password
            $userCreated = $true
            $credential = [pscredential]::new("$env:COMPUTERNAME\tbspec-packed", $password)
            $plainPassword = $null
            $password = $null
            Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $user

            New-Item -ItemType Directory -Path $sharedTemp | Out-Null
            $sharedDirectoryCreated = $true
            & icacls.exe $sharedTemp /grant 'tbspec-packed:(OI)(CI)F'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the standard-user test directory.' }
            $artifactTarget = Join-Path $sharedTemp 'packed-application'
            Copy-Item -LiteralPath (Join-Path $PWD.Path 'packed-application') -Destination $sharedTemp -Recurse

            $node = (Get-Command node).Source
            $nodeDirectory = Split-Path -Parent $node
            $npmCli = Join-Path $nodeDirectory 'node_modules\npm\bin\npm-cli.js'
            if (-not (Test-Path -LiteralPath $npmCli)) { throw 'Cannot locate the pinned Node npm CLI.' }
            $env:TEMP = $env:TMP = $sharedTemp
            $env:TBSPEC_NPM_CLI = $npmCli
            $env:TBSPEC_VERIFIER_SCRIPT = (Join-Path $PWD.Path 'app\scripts\verify-packed-application.mjs')
            $env:TBSPEC_EVIDENCE_PATH = (Join-Path $sharedTemp 'windows.json')
            $env:TBSPEC_PLATFORM = 'windows'
            $stdout = Join-Path $sharedTemp 'verify.stdout'
            $stderr = Join-Path $sharedTemp 'verify.stderr'
            $arguments = @($env:TBSPEC_VERIFIER_SCRIPT, $artifactTarget)
            $result = Start-Process -FilePath $node -ArgumentList $arguments -WorkingDirectory (Join-Path $PWD.Path 'app') -Credential $credential -LoadUserProfile -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            $operationExitCode = $result.ExitCode
            Get-Content -LiteralPath $stdout
            Get-Content -LiteralPath $stderr
            if ($operationExitCode -ne 0) { throw 'Installed package verification failed.' }
          } catch {
            $operationFailed = $true
            Write-Output "::error::Windows installed verification setup or run failed: $($_.Exception.Message)"
          } finally {
            if ($userCreated) {
              try {
                Remove-LocalUser -Name 'tbspec-packed' -ErrorAction Stop
                if ($null -ne (Get-LocalUser -Name 'tbspec-packed' -ErrorAction SilentlyContinue)) {
                  throw 'The temporary standard-user account remains after removal.'
                }
                $accountRemoved = $true
              } catch {
                $null = $cleanupFailures.Add('account-removal')
              }
            }

            if ($sharedDirectoryCreated) {
              try {
                $actualPublic = [IO.Path]::GetFullPath($env:PUBLIC)
                $actualExpected = [IO.Path]::GetFullPath((Join-Path $env:SystemDrive 'Users\Public'))
                if (-not [string]::Equals($actualPublic, $actualExpected, [StringComparison]::OrdinalIgnoreCase) -or
                    -not [string]::Equals($sharedTemp, [IO.Path]::GetFullPath((Join-Path $actualExpected 'tbspec-packed-tests')), [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'The shared test cleanup path failed its confinement check.'
                }
                $root = Get-Item -Force -LiteralPath $sharedTemp -ErrorAction Stop
                if (($root.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw 'The shared test directory became a reparse point; refusing recursive cleanup.'
                }
                $reparsePoints = Get-ChildItem -Force -Recurse -LiteralPath $sharedTemp -ErrorAction Stop |
                  Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }
                if ($null -ne $reparsePoints) {
                  throw 'The shared test directory contains a reparse point; refusing recursive cleanup.'
                }
                $evidenceSource = Join-Path $sharedTemp 'windows.json'
                if (-not (Test-Path -LiteralPath $evidenceSource -PathType Leaf)) {
                  throw 'The standard-user verifier did not create evidence.'
                }
                $evidenceItem = Get-Item -Force -LiteralPath $evidenceSource -ErrorAction Stop
                if (($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                  throw 'The standard-user evidence became a reparse point.'
                }
                $evidenceDirectory = Split-Path -Parent $workspaceEvidence
                New-Item -ItemType Directory -Path $evidenceDirectory -Force | Out-Null
                if (Test-Path -LiteralPath $workspaceEvidence) {
                  throw 'A Windows evidence file already exists in the workflow workspace.'
                }
                Copy-Item -LiteralPath $evidenceSource -Destination $workspaceEvidence
                $evidenceCopied = $true
              } catch {
                $null = $cleanupFailures.Add('evidence-copy')
              }

              try {
                $actualPublic = [IO.Path]::GetFullPath($env:PUBLIC)
                $actualExpected = [IO.Path]::GetFullPath((Join-Path $env:SystemDrive 'Users\Public'))
                if (-not [string]::Equals($actualPublic, $actualExpected, [StringComparison]::OrdinalIgnoreCase) -or
                    -not [string]::Equals($sharedTemp, [IO.Path]::GetFullPath((Join-Path $actualExpected 'tbspec-packed-tests')), [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'The shared test cleanup path failed its confinement check.'
                }
                if (Test-Path -LiteralPath $sharedTemp) {
                  $root = Get-Item -Force -LiteralPath $sharedTemp -ErrorAction Stop
                  if (($root.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                    throw 'The shared test directory became a reparse point; refusing recursive cleanup.'
                  }
                  $reparsePoints = Get-ChildItem -Force -Recurse -LiteralPath $sharedTemp -ErrorAction Stop |
                    Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }
                  if ($null -ne $reparsePoints) {
                    throw 'The shared test directory contains a reparse point; refusing recursive cleanup.'
                  }
                  Remove-Item -LiteralPath $sharedTemp -Recurse -Force -ErrorAction Stop
                }
                if (Test-Path -LiteralPath $sharedTemp) {
                  throw 'The shared Windows test directory remains after cleanup.'
                }
                $sharedDirectoryRemoved = $true
              } catch {
                $null = $cleanupFailures.Add('shared-directory-removal')
              }
            }

            $budget.Stop()
            $smokeBudgetExceeded = $env:TBSPEC_VERIFICATION_MODE -eq 'smoke' -and $budget.ElapsedMilliseconds -gt 600000
            if ($evidenceCopied) {
              try {
                $finalization = [ordered]@{
                  startedAt = $budgetStartedAt
                  completedAt = [DateTime]::UtcNow.ToString('o')
                  durationMs = [long]$budget.ElapsedMilliseconds
                  accountRemoved = $accountRemoved
                  sharedDirectoryRemoved = $sharedDirectoryRemoved
                  cleanupFailures = $cleanupFailures.ToArray()
                  operationFailed = $operationFailed
                  operationExitCode = $operationExitCode
                  smokeBudgetExceeded = $smokeBudgetExceeded
                }
                $finalizer = Join-Path $PWD.Path 'scripts\verification-evidence.mjs'
                $finalizationJson = ConvertTo-Json -InputObject $finalization -Compress
                & $node $finalizer $workspaceEvidence $finalizationJson
                if ($LASTEXITCODE -ne 0) { throw 'Could not finalize Windows verification evidence.' }
              } catch {
                $null = $cleanupFailures.Add('evidence-update')
              }
            }
          }

          $smokeBudgetExceeded = $env:TBSPEC_VERIFICATION_MODE -eq 'smoke' -and $budget.ElapsedMilliseconds -gt 600000
          if ($operationFailed -or $operationExitCode -ne 0 -or $cleanupFailures.Count -gt 0 -or
              -not $accountRemoved -or -not $sharedDirectoryRemoved -or -not $evidenceCopied -or $smokeBudgetExceeded) {
            throw 'Windows installed verification failed, cleanup was incomplete, or the smoke budget was exceeded.'
          }
      - name: Upload installed-artifact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tbspec-installed-evidence-${{ matrix.platform_key }}
          path: packed-evidence/${{ matrix.platform_key }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
  smoke-acceptance:
    name: Application smoke
    needs: [verification-mode, application-build, packed-application]
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.verification-mode.outputs.mode == 'smoke' || needs.verification-mode.outputs.mode == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require the artifact producer and every platform lane
        env:
          MODE_RESULT: ${{ needs.verification-mode.result }}
          MODE: ${{ needs.verification-mode.outputs.mode }}
          REQUESTED_MODE: ${{ inputs.verification_mode || 'smoke' }}
          BUILD_RESULT: ${{ needs.application-build.result }}
          INSTALLED_RESULT: ${{ needs.packed-application.result }}
          PACKED_ONLY: ${{ inputs.packed_only || false }}
          MACOS_REGRESSIONS_ONLY: ${{ inputs.macos_regressions_only || false }}
          MACOS_INTEL_SOURCE_ONLY: ${{ inputs.macos_intel_source_only || false }}
        run: node scripts/require-verification-gate.mjs smoke "$GITHUB_EVENT_NAME" "$GITHUB_REF"
      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tbspec-release-candidate
          path: packed-application
      - name: Download all installed evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tbspec-installed-evidence-*
          path: packed-evidence
          merge-multiple: true
      - name: Require complete smoke evidence and cleanup
        env:
          TBSPEC_VERIFICATION_MODE: ${{ needs.verification-mode.outputs.mode }}
          TBSPEC_REPOSITORY: ${{ github.repository }}
          TBSPEC_COMMIT: ${{ github.sha }}
          TBSPEC_BRANCH: ${{ github.ref_name }}
          TBSPEC_RUN_ID: ${{ github.run_id }}
          TBSPEC_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node app/scripts/validate-verification.mjs packed-application packed-evidence smoke

  complete-verification:
    name: Complete verification
    needs:
      [
        verification-mode,
        repository-quality,
        application-build,
        application,
        packed-application,
        smoke-acceptance,
      ]
    if: ${{ always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) || (github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'full' && startsWith(github.ref, 'refs/heads/release/')) || needs.verification-mode.outputs.mode == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out evidence validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Require quality, build, source, installed and smoke gates
        env:
          MODE_RESULT: ${{ needs.verification-mode.result }}
          MODE: ${{ needs.verification-mode.outputs.mode }}
          REQUESTED_MODE: ${{ inputs.verification_mode || 'smoke' }}
          QUALITY_RESULT: ${{ needs.repository-quality.result }}
          BUILD_RESULT: ${{ needs.application-build.result }}
          SOURCE_RESULT: ${{ needs.application.result }}
          INSTALLED_RESULT: ${{ needs.packed-application.result }}
          SMOKE_RESULT: ${{ needs.smoke-acceptance.result }}
          PACKED_ONLY: ${{ inputs.packed_only || false }}
          MACOS_REGRESSIONS_ONLY: ${{ inputs.macos_regressions_only || false }}
          MACOS_INTEL_SOURCE_ONLY: ${{ inputs.macos_intel_source_only || false }}
        run: node scripts/require-verification-gate.mjs full "$GITHUB_EVENT_NAME" "$GITHUB_REF"
      - name: Download release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tbspec-release-candidate
          path: packed-application
      - name: Download all installed evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tbspec-installed-evidence-*
          path: packed-evidence
          merge-multiple: true
      - name: Bind complete verification to this run and artifact
        env:
          TBSPEC_REPOSITORY: ${{ github.repository }}
          TBSPEC_COMMIT: ${{ github.sha }}
          TBSPEC_BRANCH: ${{ github.ref_name }}
          TBSPEC_RUN_ID: ${{ github.run_id }}
          TBSPEC_RUN_ATTEMPT: ${{ github.run_attempt }}
          TBSPEC_QUALITY_RESULT: ${{ needs.repository-quality.result }}
          TBSPEC_BUILD_RESULT: ${{ needs.application-build.result }}
          TBSPEC_SOURCE_RESULT: ${{ needs.application.result }}
          TBSPEC_INSTALLED_RESULT: ${{ needs.packed-application.result }}
          TBSPEC_SMOKE_RESULT: ${{ needs.smoke-acceptance.result }}
        run: node app/scripts/validate-verification.mjs packed-application packed-evidence full release-verification
      - name: Publish complete verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tbspec-release-verification
          path: release-verification/verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  macos-regressions:
    name: Node 24 focused macOS regressions (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_regressions_only == true }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-latest, macos-15-intel]
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install isolated application dependencies
        run: npm ci
      - name: Typecheck and compile
        run: npm run typecheck && npm run build
      - name: Test native macOS process identity
        if: ${{ inputs.macos_regression_set == 'all' }}
        run: node --test tests/macos-ownership.test.ts
      - name: Test transaction rollback on both macOS architectures
        if: ${{ inputs.macos_regression_set == 'all' }}
        run: node --test --test-concurrency=1 tests/dependencies-transaction.test.ts tests/transactions.test.ts
      - name: Test locked editor design resolution and read-only behavior
        if: ${{ inputs.macos_regression_set == 'all' }}
        run: node --test --test-name-pattern='locked model editor inspection resolves manual design support and remains read-only' tests/editor-design-web.test.ts
      - name: Test authenticated view membership and presentation over HTTP
        if: ${{ inputs.macos_regression_set == 'all' }}
        run: node --test --test-name-pattern='authenticated views keep independent membership and presentation and include exact endpoints' tests/views-web.test.ts
      - name: Test authenticated dependency acquisition over HTTP
        if: ${{ inputs.macos_regression_set == 'all' || inputs.macos_regression_set == 'slow-http' }}
        run: node --test --test-name-pattern='authenticated HTTP stages, applies, lists and shows an acquired directory dependency' tests/web.test.ts
      - name: Test authenticated repair API staging and application
        if: ${{ inputs.macos_regression_set == 'all' || inputs.macos_regression_set == 'slow-http' }}
        run: node --test --test-name-pattern='authenticated repair API stages IRI refactor, scoped removal and separately selected GC' tests/repair-web.test.ts

  macos-intel-source:
    name: Node 24 Intel source partition ${{ matrix.partition }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_intel_source_only == true && inputs.packed_only != true && inputs.macos_regressions_only != true }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: ${{ fromJSON(inputs.macos_intel_partition == 'all' && '[0,1,2]' || inputs.macos_intel_partition == '0' && '[0]' || inputs.macos_intel_partition == '1' && '[1]' || '[2]') }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install isolated application dependencies
        run: npm ci
      - name: Typecheck and compile
        run: npm run typecheck && npm run build
      - name: Test public operations and processes in a source partition
        run: node scripts/test-source.mjs ${{ matrix.partition }} 3
